</div>

<button onclick="goToSetup()" class="w-full py-3.5 rounded-xl bg-cherryRed hover:bg-darkRed text-white font-pop font-bold text-sm tracking-wide transition shadow-pop-btn active:translate-y-0.5">

        window.startQuiz = function(categoryKey) {
            selectedCategoryKey = categoryKey;
            const category = QUESTION_DATABASE[categoryKey];
            if (!category) return;

            currentQuestions = [...category.questions].sort(() => Math.random() - 0.5);
            currentQuestionIdx = 0;
score = 0;
timerSeconds = 600;
playerAnswers = [];
gameActive = true;

            document.getElementById('game-theme-icon').className = `fa-solid ${category.iconClass}`;
            document.getElementById('game-theme-title').innerText = category.title;
            document.getElementById('game-player-display').innerText = `Équipe ${currentTeam}`;

            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('view-result').classList.add('hidden');
            document.getElementById('view-game').classList.remove('hidden');

            renderQuestion();
            startTimer();
        }

        function startTimer() {
    clearInterval(timerInterval);

    const timerBar = document.getElementById('timer-bar');
    const timerText = document.getElementById('timer-text');

    const startTime = Date.now();
    const totalTime = 600000;

    timerBar.style.width = '100%';

    timerInterval = setInterval(() => {
        if (!gameActive) return;

        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, totalTime - elapsed);

        timerSeconds = Math.ceil(remaining / 1000);
        timerText.innerText = timerSeconds;

        const percentage = (remaining / totalTime) * 100;
        timerBar.style.width = `${percentage}%`;

        if (timerSeconds <= 10) {
            timerBar.classList.remove('bg-cherryRed');
            timerBar.classList.add('bg-red-600');
        } else {
            timerBar.classList.remove('bg-red-600');
            timerBar.classList.add('bg-cherryRed');
        }

        if (remaining <= 0) {
            clearInterval(timerInterval);
            endQuiz();
        }
    }, 50);
}

        function updateTimerDisplay() {
    const timerText = document.getElementById('timer-text');
    const timerBar = document.getElementById('timer-bar');

    timerText.innerText = Math.max(0, timerSeconds);

    const percentage = (Math.max(0, timerSeconds) / 600) * 100;
    timerBar.style.width = `${percentage}%`;

    if (timerSeconds <= 10) {
        timerBar.classList.remove('bg-cherryRed');
        timerBar.classList.add('bg-red-600');
    } else {
        timerBar.classList.remove('bg-red-600');
        timerBar.classList.add('bg-cherryRed');
    }
}

        function renderQuestion() {
            if (currentQuestionIdx >= currentQuestions.length) {
                endQuiz();
                return;
            }

            const qData = currentQuestions[currentQuestionIdx];
            document.getElementById('question-count-text').innerText = `Question ${currentQuestionIdx + 1} / ${currentQuestions.length}`;
            document.getElementById('score-counter').innerText = `Bonnes réponses : ${score}`;
            document.getElementById('question-text').innerText = qData.q;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const prefixes = ['A', 'B', 'C', 'D'];

            qData.options.forEach((optionText, idx) => {
                const btn = document.createElement('button');
                btn.onclick = () => handleAnswer(idx);
                btn.className = "quiz-option-btn w-full p-3.5 sm:p-4 rounded-xl text-left flex items-center gap-3 active:scale-[0.99] transition";
                
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-lg bg-softPink border border-cherryRed text-cherryRed font-pop font-bold text-sm flex items-center justify-center shrink-0">
                        ${prefixes[idx]}
                    </span>
                    <span class="font-semibold text-slate-800 text-xs sm:text-base leading-snug">
                        ${optionText}
                    </span>
                `;
                container.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex) {
    if (!gameActive) return;

    const qData = currentQuestions[currentQuestionIdx];
    const isCorrect = selectedIndex === qData.correct;

    playerAnswers.push({
        question: qData.q,
        selectedAnswer: qData.options[selectedIndex],
        correctAnswer: qData.options[qData.correct],
        isCorrect: isCorrect,
        explanation: qData.explanation || "Cette réponse permet de comprendre la notion abordée dans cette question."
    });

    if (isCorrect) {
        score++;
    }

    currentQuestionIdx++;

    if (currentQuestionIdx < currentQuestions.length) {
        renderQuestion();
    } else {
        endQuiz();
    }
}

        function endQuiz() {
    gameActive = false;
    clearInterval(timerInterval);

    const timeUsed = 600 - Math.max(0, timerSeconds);
    renderCorrections();

    document.getElementById('view-game').classList.add('hidden');
    document.getElementById('view-result').classList.remove('hidden');

    document.getElementById('result-subtitle').innerText =
        `Résultat final pour l'Équipe ${currentTeam}`;

    document.getElementById('final-score-val').innerText =
        `${score} / ${currentQuestions.length}`;

    document.getElementById('final-time-val').innerText =
        `${timeUsed}s`;

    if (score >= 5 && typeof confetti === 'function') {
        confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 }
        });
    }
}
function renderCorrections() {
    const container = document.getElementById('correction-container');

    if (!container) return;

    container.innerHTML = `
        <h3 class="text-xl font-pop font-bold text-cherryRed mb-4">
            Correction des 10 questions
        </h3>
    `;

    playerAnswers.forEach((answer, index) => {
        const card = document.createElement('div');

        card.className = `p-4 rounded-xl border-2 ${
            answer.isCorrect
                ? 'border-green-500 bg-green-50'
                : 'border-red-400 bg-red-50'
        }`;

        card.innerHTML = `
            <div class="font-pop font-bold text-slate-800 mb-2">
                Question ${index + 1}
            </div>

            <div class="font-semibold text-slate-800 mb-3">
                ${answer.question}
            </div>

            <div class="text-sm mb-2">
                <strong>Ta réponse :</strong>
                ${answer.selectedAnswer}
            </div>

            <div class="text-sm mb-2">
                <strong>Bonne réponse :</strong>
                ${answer.correctAnswer}
            </div>

            <div class="text-sm text-slate-600">
                <strong>Explication :</strong>
                ${answer.explanation}
            </div>
        `;

        container.appendChild(card);
    });
}

        function goToSetup() {
            gameActive = false;
            clearInterval(timerInterval);
            document.getElementById('view-game').classList.add('hidden');
            document.getElementById('view-result').classList.add('hidden');
            document.getElementById('view-setup').classList.remove('hidden');
        }

        function resetApp() {
    setTeam(1);
    goToSetup();
}

function setupCardClicks() {
    document.querySelectorAll('.card-dossier').forEach(card => {
        card.addEventListener('click', () => {
            startQuiz(card.dataset.category);
        });
    });
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupCardClicks);
} else {
    setupCardClicks();
}
    </script>
