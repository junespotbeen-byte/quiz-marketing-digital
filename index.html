    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background-color: #FFE4E6;
            background-image: radial-gradient(#C8102E 1.5px, transparent 1.5px), radial-gradient(#FF7AA2 1.5px, #FFE4E6 1.5px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        .font-pop {
            font-family: 'Fredoka', cursive, sans-serif;
        }

        .card-dossier {
            background: #FFFFFF;
            border: 3px solid #C8102E;
            box-shadow: 6px 6px 0px 0px #C8102E;
            transition: all 0.15s ease-in-out;
            position: relative;
        }

        .card-dossier:active {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0px 0px #C8102E;
        }

        .quiz-option-btn {
            background: #FFFFFF;
            border: 3px solid #C8102E;
            box-shadow: 4px 4px 0px 0px #C8102E;
            transition: all 0.1s ease;
        }

        .quiz-option-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px #C8102E;
            background-color: #FFF0F3;
        }

    </header>

                            </span>
                            <i class="fa-solid fa-hashtag text-cherryRed text-3xl sm:text-4xl"></i>
                        </div>
                        <div>
                            <h2 class="font-pop text-xl sm:text-2xl font-bold text-cherryRed">Réseaux Sociaux</h2>
                            <p class="text-xs sm:text-base text-slate-700 mt-2 font-semibold leading-relaxed">Algorithmes, engagement & viralité des contenus.</p>
                        </div>
                    </button>

                    <button onclick="startQuiz('crypto')" class="card-dossier p-6 sm:p-8 rounded-3xl text-left flex flex-col justify-between h-52 sm:h-64">
                        <div class="flex justify-between items-center w-full">
                            <span class="font-pop text-xs sm:text-sm font-bold uppercase text-white bg-cherryRed px-3.5 py-1.5 rounded-full border border-darkRed">
                                Carte 2
                            </span>

                        </div>
                        <div>
                            <h2 class="font-pop text-xl sm:text-2xl font-bold text-cherryRed">Monnaies Virtuelles</h2>
                            <p class="text-xs sm:text-base text-slate-700 mt-2 font-semibold leading-relaxed">Bitcoin, transactions, wallets & blockchain.</p>
                        </div>
                    </button>

                    <button onclick="startQuiz('influencer')" class="card-dossier p-6 sm:p-8 rounded-3xl text-left flex flex-col justify-between h-52 sm:h-64">
                        <div class="flex justify-between items-center w-full">
                            <span class="font-pop text-xs sm:text-sm font-bold uppercase text-white bg-cherryRed px-3.5 py-1.5 rounded-full border border-darkRed">
                                Carte 3
                            </span>
                            <i class="fa-solid fa-bullhorn text-cherryRed text-3xl sm:text-4xl"></i>
                        </div>
                        <div>
                            <h2 class="font-pop text-xl sm:text-2xl font-bold text-cherryRed">Influenceurs</h2>
                            <p class="text-xs sm:text-base text-slate-700 mt-2 font-semibold leading-relaxed">Sponsorings, placements de produits & règles.</p>
                        </div>
                    </button>

                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 sm:gap-8 w-full sm:w-4/5 mx-auto">
                    
                    <button onclick="startQuiz('data')" class="card-dossier p-6 sm:p-8 rounded-3xl text-left flex flex-col justify-between h-52 sm:h-64">

        <section id="view-game" class="hidden w-full max-w-2xl space-y-4">

                </div>

                <div>
                    <h2 id="result-title" class="font-pop text-2xl sm:text-3xl font-bold text-cherryRed">
                        Fin de la partie !

        function setTeam(teamNum) {
            currentTeam = teamNum;
            const btn1 = document.getElementById('btn-team-1');
            const btn2 = document.getElementById('btn-team-2');

            if (teamNum === 1) {
                btn1.className = "px-4 py-2 rounded-xl font-pop font-bold text-xs sm:text-sm transition bg-cherryRed text-white shadow-pop-btn";
                btn1.innerHTML = `<i class="fa-solid fa-heart text-xs mr-1"></i> Équipe 1`;
                
                btn2.className = "px-4 py-2 rounded-xl font-pop font-bold text-xs sm:text-sm transition text-cherryRed hover:bg-softPink";
                btn2.innerHTML = `Équipe 2`;
            } else {
                btn2.className = "px-4 py-2 rounded-xl font-pop font-bold text-xs sm:text-sm transition bg-cherryRed text-white shadow-pop-btn";
                btn2.innerHTML = `<i class="fa-solid fa-heart text-xs mr-1"></i> Équipe 2`;
                
                btn1.className = "px-4 py-2 rounded-xl font-pop font-bold text-xs sm:text-sm transition text-cherryRed hover:bg-softPink";
                btn1.innerHTML = `Équipe 1`;
            }
        }

        function startQuiz(categoryKey) {
            selectedCategoryKey = categoryKey;
            const category = QUESTION_DATABASE[categoryKey];
            if (!category) return;

            currentQuestions = [...category.questions].sort(() => Math.random() - 0.5);
            currentQuestionIdx = 0;
            score = 0;
            timerSeconds = 600;
            gameActive = true;

            document.getElementById('game-theme-icon').className = `fa-solid ${category.iconClass}`;
            document.getElementById('game-theme-title').innerText = category.title;
            document.getElementById('game-player-display').innerText = `Équipe ${currentTeam}`;

            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('view-result').classList.add('hidden');
            document.getElementById('view-game').classList.remove('hidden');

            renderQuestion();
            startTimer();
        }

        function startTimer() {
    clearInterval(timerInterval);

    const timerBar = document.getElementById('timer-bar');
    const timerText = document.getElementById('timer-text');

    const startTime = Date.now();
    const totalTime = 600000;

    timerBar.style.width = '100%';

    timerInterval = setInterval(() => {
        if (!gameActive) return;

        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, totalTime - elapsed);

        timerSeconds = Math.ceil(remaining / 1000);
        timerText.innerText = timerSeconds;

        const percentage = (remaining / totalTime) * 100;
        timerBar.style.width = `${percentage}%`;

        if (timerSeconds <= 10) {
            timerBar.classList.remove('bg-cherryRed');
            timerBar.classList.add('bg-red-600');
        } else {
            timerBar.classList.remove('bg-red-600');
            timerBar.classList.add('bg-cherryRed');
        }

        if (remaining <= 0) {
            clearInterval(timerInterval);
            endQuiz();
        }
    }, 50);
}

        function updateTimerDisplay() {
    const timerText = document.getElementById('timer-text');
    const timerBar = document.getElementById('timer-bar');

    timerText.innerText = Math.max(0, timerSeconds);

    const percentage = (Math.max(0, timerSeconds) / 600) * 100;
    timerBar.style.width = `${percentage}%`;

    if (timerSeconds <= 10) {
        timerBar.classList.remove('bg-cherryRed');
        timerBar.classList.add('bg-red-600');
    } else {
        timerBar.classList.remove('bg-red-600');
        timerBar.classList.add('bg-cherryRed');
    }
}

        function renderQuestion() {
            if (currentQuestionIdx >= currentQuestions.length) {
                endQuiz();
                return;
            }

            const qData = currentQuestions[currentQuestionIdx];
            document.getElementById('question-count-text').innerText = `Question ${currentQuestionIdx + 1} / ${currentQuestions.length}`;
            document.getElementById('score-counter').innerText = `Bonnes réponses : ${score}`;
            document.getElementById('question-text').innerText = qData.q;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const prefixes = ['A', 'B', 'C', 'D'];

            qData.options.forEach((optionText, idx) => {
                const btn = document.createElement('button');
                btn.onclick = () => handleAnswer(idx);
                btn.className = "quiz-option-btn w-full p-3.5 sm:p-4 rounded-xl text-left flex items-center gap-3 active:scale-[0.99] transition";
                
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-lg bg-softPink border border-cherryRed text-cherryRed font-pop font-bold text-sm flex items-center justify-center shrink-0">
                        ${prefixes[idx]}
                    </span>
                    <span class="font-semibold text-slate-800 text-xs sm:text-base leading-snug">
                        ${optionText}
                    </span>
                `;
                container.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex) {
            if (!gameActive) return;

            const qData = currentQuestions[currentQuestionIdx];
            if (selectedIndex === qData.correct) {
                score++;
            }

            currentQuestionIdx++;

            if (currentQuestionIdx < currentQuestions.length) {
                renderQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            gameActive = false;
            clearInterval(timerInterval);

            const timeUsed = 600 - Math.max(0, timerSeconds);

            document.getElementById('view-game').classList.add('hidden');
            document.getElementById('view-result').classList.remove('hidden');

            document.getElementById('result-subtitle').innerText = `Résultat final pour l'Équipe ${currentTeam}`;
            document.getElementById('final-score-val').innerText = `${score} / ${currentQuestions.length}`;
            document.getElementById('final-time-val').innerText = `${timeUsed}s`;

            if (score >= 5 && typeof confetti === 'function') {
    confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 }
    });
}

        function goToSetup() {
            gameActive = false;
            clearInterval(timerInterval);
            document.getElementById('view-game').classList.add('hidden');
            document.getElementById('view-result').classList.add('hidden');
            document.getElementById('view-setup').classList.remove('hidden');
        }

        function resetApp() {
            setTeam(1);
            goToSetup();
        }
    </script>
